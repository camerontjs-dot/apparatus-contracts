[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apparatus-contracts"
version = "0.1.0"
description = "Canonical contracts and verifier suite for the research scaffold evaluation apparatus."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["contracts", "validation", "provenance", "audit", "alcoa", "21cfr11"]
authors = [
    { name = "Cameron Sanderson" },
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=6.0,<7",
    "pydantic>=2.6,<3",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.15,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
apparatus-verify = "validators.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["validators*"]
exclude = ["tests*"]
