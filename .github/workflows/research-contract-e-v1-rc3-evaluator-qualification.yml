name: Research Contract E v1 RC3 fresh evaluator qualification

on:
  push:
    branches:
      - research/contract-e-v1-rc3-exact-currentness-jcs-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify Contract E RC3 fresh evaluator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact canonicalization dependency
        run: python -m pip install --disable-pip-version-check 'rfc8785==0.1.4'
      - name: Verify frozen candidate byte identities
        shell: bash
        run: |
          set -euo pipefail
          base="docs/research/contract-e/v1-rc3-exact-currentness-jcs-20260902/candidate"
          test "$(git hash-object "$base/SPEC.md")" = "8c142c6b86dd2512f1df0c19aa36dbef759d6c18"
          test "$(git hash-object "$base/schema.json")" = "87ec0e536de1d07b45f49c20b14bfa0c81f53a86"
          test "$(git hash-object "$base/reference.py")" = "ede55efbe3f8afc35a25716af4a896a669a904e7"
          test "$(git hash-object "$base/test_candidate.py")" = "20db39ac2a0b46cd554bf3c6e266859d39e9ea25"
      - name: Re-run frozen candidate suite
        shell: bash
        run: |
          set -euo pipefail
          cd docs/research/contract-e/v1-rc3-exact-currentness-jcs-20260902/candidate
          python test_candidate.py
      - name: Qualify evaluator and weak controls
        shell: bash
        run: |
          set -euo pipefail
          python sealed/contract-e-v1-rc3-fresh/qualify.py | tee sealed/contract-e-v1-rc3-fresh/qualification/qualification.log
      - name: Capture exact evaluator identities
        shell: bash
        run: |
          set -euo pipefail
          root="sealed/contract-e-v1-rc3-fresh"
          {
            printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
            printf 'QUALIFICATION_CONTRACT_BLOB=%s\n' "$(git hash-object "$root/QUALIFICATION-CONTRACT.md")"
            printf 'EVALUATOR_BLOB=%s\n' "$(git hash-object "$root/evaluate_fresh.py")"
            printf 'HIDDEN_CASES_BLOB=%s\n' "$(git hash-object "$root/hidden_cases.py")"
            printf 'QUALIFIER_BLOB=%s\n' "$(git hash-object "$root/qualify.py")"
            sha256sum \
              "$root/QUALIFICATION-CONTRACT.md" \
              "$root/evaluate_fresh.py" \
              "$root/hidden_cases.py" \
              "$root/qualify.py" \
              "$root/qualification/QUALIFICATION_RECEIPT.json"
          } > "$root/qualification/EVALUATOR_IDENTITIES.txt"
          cat "$root/qualification/EVALUATOR_IDENTITIES.txt"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-e-v1-rc3-fresh-evaluator-qualification-${{ github.sha }}
          path: |
            sealed/contract-e-v1-rc3-fresh/qualification/
          if-no-files-found: error
          retention-days: 90
