name: Research Contract E v1 RC2 fresh evaluator qualification

on:
  push:
    branches:
      - research/contract-e-v1-rc2-dual-state-identity-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify Contract E RC2 fresh evaluator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify frozen candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          base="docs/research/contract-e/v1-rc2-dual-state-identity-20260902/candidate"
          test "$(git hash-object "$base/SPEC.md")" = "ae8efaaa0328045da23932925f5c213a0c45ffb2"
          test "$(git hash-object "$base/schema.json")" = "81eecca43a87b83a4e40dc70c9e4950617ff7fa2"
          test "$(git hash-object "$base/reference.py")" = "f4d0d22b88512d3e7a4eadd12774c7aa966e67cf"
          test "$(git hash-object "$base/test_candidate.py")" = "7e30e6eb9624291ac708ec651690daade550e685"
          echo "da9e29206b86399ca40feea53af42e5a54293713cd778314f23122fdd703b762  $base/SPEC.md" | sha256sum -c -
          echo "deea96f9ae4fd6886fecad021425ca23f3ece46128834087835ee31c8cc638e8  $base/schema.json" | sha256sum -c -
          echo "1a0c2ffe94cb889008b6fbb9b82716176dde122a2e827520224b07f4f75af338  $base/reference.py" | sha256sum -c -
          echo "c0cffba6b7a148a585cca6e42c5af3be9a8b4add423e8d054ef910c64dbf77fb  $base/test_candidate.py" | sha256sum -c -

      - name: Verify freeze receipt still describes candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/research/contract-e/v1-rc2-dual-state-identity-20260902/CANDIDATE_FREEZE_RECEIPT.json")
          d = json.loads(p.read_text())
          assert d["candidate_freeze_head"] == "f616f6ed06bf922a53846d464dfc44838c55804d"
          assert d["fresh_implementation_existed_at_freeze"] is False
          assert d["production_authorization"] is False
          assert d["accepted_gate"]["run_id"] == 33673336584
          assert d["accepted_gate"]["migrated_consumer_pressure"]["case_count"] == 101
          assert d["accepted_gate"]["migrated_consumer_pressure"]["pass_count"] == 101
          PY

      - name: Re-run frozen candidate suite
        shell: bash
        run: |
          set -euo pipefail
          cd docs/research/contract-e/v1-rc2-dual-state-identity-20260902/candidate
          python test_candidate.py

      - name: Qualify evaluator
        shell: bash
        run: |
          set -euo pipefail
          python sealed/contract-e-v1-rc2-fresh/qualify.py

      - name: Capture evaluator identities
        shell: bash
        run: |
          set -euo pipefail
          dir="sealed/contract-e-v1-rc2-fresh"
          {
            echo '{'
            first=1
            for file in QUALIFICATION-CONTRACT.md evaluate_fresh.py hidden_cases.py qualify.py; do
              blob="$(git hash-object "$dir/$file")"
              digest="$(sha256sum "$dir/$file" | awk '{print $1}')"
              if [ "$first" -eq 0 ]; then echo ','; fi
              first=0
              printf '  "%s": {"git_blob": "%s", "sha256": "%s"}' "$file" "$blob" "$digest"
            done
            echo
            echo '}'
          } > "$dir/qualification/EVALUATOR_IDENTITIES.json"
          cat "$dir/qualification/EVALUATOR_IDENTITIES.json"

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: contract-e-v1-rc2-fresh-evaluator-qualification-${{ github.sha }}
          path: |
            sealed/contract-e-v1-rc2-fresh/qualification/QUALIFICATION_RECEIPT.json
            sealed/contract-e-v1-rc2-fresh/qualification/EVALUATOR_IDENTITIES.json
          if-no-files-found: error
