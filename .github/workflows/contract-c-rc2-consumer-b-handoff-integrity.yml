name: Contract C RC2 Consumer B handoff integrity

on:
  push:
    branches:
      - research-infra/contract-c-rc2-consumer-b-handoff
    paths:
      - 'handoffs/contract-c/rc2-consumer-b/**'
      - '.github/workflows/contract-c-rc2-consumer-b-handoff-integrity.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'handoffs/contract-c/rc2-consumer-b/**'
      - '.github/workflows/contract-c-rc2-consumer-b-handoff-integrity.yml'

permissions:
  contents: read

jobs:
  verify-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen handoff identities and Contract-B payload
        run: python handoffs/contract-c/rc2-consumer-b/verify_handoff.py
