name: Contract C CAL polarity authority successor RC0

on:
  push:
    branches:
      - research/contract-c-cal-v1-polarity-authority-successor-rc0-20261003
  pull_request:
    branches:
      - promotion/contract-c-cal-v1-parent-bound-candidate-freeze-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout research subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen apparatus identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/contract_c_cal_v1_polarity_authority_successor_rc0_20261003/evaluate.py)" = "897f2ce150837adf93ce2a8547ed52090fe7fd67"
          test "$(git rev-parse HEAD:research/contract_c_cal_v1_polarity_authority_successor_rc0_20261003/candidate_rc0.py)" = "aeb50dee8d24bda5f62eb879654e80437a50912d"

      - name: Checkout exact CAL polarity runtime
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 86b60022420a006358fde38b20a204ffe4df1a96
          path: _cal_successor
          fetch-depth: 1

      - name: Checkout exact CAL projection authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 1d3c67f39921f0ad08716b71589e2babfcfa43b9
          path: _cal_projection
          fetch-depth: 1

      - name: Checkout frozen CAL integration fixture
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: e24e405f5336ee024674f39dba97255bb58a2dd9
          path: _cal_fixture
          fetch-depth: 1

      - name: Checkout frozen Evidence Bundler
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: 4e1f6fe00e7c350b28f52bfea14f1f8988847884
          path: _eb
          fetch-depth: 1

      - name: Checkout exact Candidate A RC2 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: b42c827acb0a9fe65353354d709add0e27bab307
          path: _c2
          fetch-depth: 1

      - name: Checkout exact old resolver
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 1d33e0612befcf8016816197c90c062373796df9
          path: _old_resolver
          fetch-depth: 1

      - name: Checkout exact successor resolver
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 292168222f83c67a24190b4846eebe84392e3d04
          path: _resolver_successor
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pydantic PyYAML click typer pypdf pdfminer.six rank-bm25

      - name: Execute frozen authority-successor evaluator
        env:
          CAL_ROOT: ${{ github.workspace }}/_cal_successor
          CAL_FIXTURE_ROOT: ${{ github.workspace }}/_cal_fixture
          EB_ROOT: ${{ github.workspace }}/_eb
          CAL_EB_INTEGRATION_REPO: ${{ github.workspace }}/_eb
          C2_ROOT: ${{ github.workspace }}/_c2
          RESOLVER_ROOT: ${{ github.workspace }}/_resolver_successor
          RESOLVER_JSON: ${{ github.workspace }}/_resolver_successor/research/contract_c_cal_v1_polarity_authority_successor_rc0_20261003/RESOLVER.json
          OLD_RESOLVER_JSON: ${{ github.workspace }}/_old_resolver/research/contract_c2_current_cal_resolver_successor_rc0/RESOLVER.json
          PROJECTION_ROOT: ${{ github.workspace }}/_cal_projection
          PYTHONPATH: ${{ github.workspace }}/_cal_successor/src:${{ github.workspace }}/_eb/src
        run: |
          mkdir -p outputs
          python research/contract_c_cal_v1_polarity_authority_successor_rc0_20261003/evaluate.py outputs/result.json

      - name: Upload decisive receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-c-cal-polarity-authority-${{ github.sha }}
          if-no-files-found: warn
          path: |
            outputs/result.json
