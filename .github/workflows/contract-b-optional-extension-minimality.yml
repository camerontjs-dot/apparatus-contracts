name: Contract B optional extension minimality research

on:
  push:
    branches:
      - research/contract-b-optional-extension-minimality
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optional-extension-minimality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Apparatus experiment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Evidence Bundler research head
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: b4ca9111f5957ef7e7955e2c5024f2280ee19eb5
          path: _deps/evidence-bundler

      - name: Checkout pinned Claim Audit Lab research head
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 6acc3462dad73959ccec6bccf8407215f5274cf6
          path: _deps/claim-audit-lab

      - name: Verify and record exact heads
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiment-results/contract-b-optional-extension-minimality
          APPARATUS_HEAD="$(git rev-parse HEAD)"
          EB_HEAD="$(git -C _deps/evidence-bundler rev-parse HEAD)"
          CAL_HEAD="$(git -C _deps/claim-audit-lab rev-parse HEAD)"
          printf 'apparatus_experiment=%s\nevidence_bundler=%s\nclaim_audit_lab=%s\n' \
            "$APPARATUS_HEAD" "$EB_HEAD" "$CAL_HEAD" \
            | tee experiment-results/contract-b-optional-extension-minimality/pins.txt
          test "$EB_HEAD" = "b4ca9111f5957ef7e7955e2c5024f2280ee19eb5"
          test "$CAL_HEAD" = "6acc3462dad73959ccec6bccf8407215f5274cf6"
          git merge-base --is-ancestor f4ee2dbd853821ba54328156bbab1c71235fae55 HEAD
          git merge-base --is-ancestor 63e8506396132a44ebc0e6c2312047e99b1125eb HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run locked Apparatus verifier controls
        id: apparatus
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests \
            2>&1 | tee experiment-results/contract-b-optional-extension-minimality/apparatus-controls.log

      - name: Run optional extension and ablation probe
        id: probe
        continue-on-error: true
        shell: bash
        env:
          EB_ROOT: ${{ github.workspace }}/_deps/evidence-bundler
          CAL_ROOT: ${{ github.workspace }}/_deps/claim-audit-lab
          RESULTS_DIR: ${{ github.workspace }}/experiment-results/contract-b-optional-extension-minimality
        run: |
          set -o pipefail
          python experiments/contract_b_optional_extension_minimality.py \
            2>&1 | tee experiment-results/contract-b-optional-extension-minimality/probe.log

      - name: Emit research evidence to workflow log
        if: always()
        shell: bash
        run: |
          printf '\n===== SUMMARY =====\n'
          if test -f experiment-results/contract-b-optional-extension-minimality/summary.md; then
            cat experiment-results/contract-b-optional-extension-minimality/summary.md
          fi
          printf '\n===== RESULT JSON =====\n'
          if test -f experiment-results/contract-b-optional-extension-minimality/result.json; then
            cat experiment-results/contract-b-optional-extension-minimality/result.json
          fi

      - name: Record workflow outcomes
        if: always()
        shell: bash
        run: |
          cat > experiment-results/contract-b-optional-extension-minimality/workflow-outcomes.json <<'JSON'
          {
            "pin_verification": "${{ steps.pins.outcome }}",
            "apparatus_verifier_controls": "${{ steps.apparatus.outcome }}",
            "optional_extension_minimality_probe": "${{ steps.probe.outcome }}"
          }
          JSON
          cat experiment-results/contract-b-optional-extension-minimality/workflow-outcomes.json

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-b-optional-extension-minimality-${{ github.run_id }}
          path: experiment-results/contract-b-optional-extension-minimality/
          if-no-files-found: error
          retention-days: 90

      - name: Fail workflow if a required research gate failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.pins.outcome }}" = "success"
          test "${{ steps.apparatus.outcome }}" = "success"
          test "${{ steps.probe.outcome }}" = "success"
