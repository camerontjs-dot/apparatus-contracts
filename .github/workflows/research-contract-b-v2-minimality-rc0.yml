name: Research Contract B v2 minimality RC0

on:
  pull_request:
    paths:
      - "research/contract-b-v2-minimality-rc0-20260907/**"
      - ".github/workflows/research-contract-b-v2-minimality-rc0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-contract-b-v2-rc0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pressure-test:
    name: pressure-test-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install apparatus contracts
        run: python -m pip install -e ".[dev]"

      - name: Run frozen Contract B v2 RC0 pressure tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p research/contract-b-v2-minimality-rc0-20260907/ci-generated
          pytest -q research/contract-b-v2-minimality-rc0-20260907/test_candidate.py \
            2>&1 | tee research/contract-b-v2-minimality-rc0-20260907/ci-generated/PRESSURE_TEST_PY${{ matrix.python-version }}.txt

      - name: Ordinary repository regression
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            --ignore=research/contract-b-v2-minimality-rc0-20260907/test_candidate.py \
            2>&1 | tee research/contract-b-v2-minimality-rc0-20260907/ci-generated/REPOSITORY_REGRESSION_PY${{ matrix.python-version }}.txt

      - name: Assert research candidate has no CAL dependency
        shell: bash
        run: |
          set -o pipefail
          if grep -R -n -E 'claim_audit_lab|audit_claims|from[[:space:]]+claim_audit_lab|import[[:space:]]+claim_audit_lab' \
            research/contract-b-v2-minimality-rc0-20260907 \
            --exclude='SPEC.md'; then
            echo "CAL dependency found" >&2
            exit 1
          fi
          echo "NO_CAL_DEPENDENCY" | tee research/contract-b-v2-minimality-rc0-20260907/ci-generated/NO_CAL_DEPENDENCY_PY${{ matrix.python-version }}.txt

      - name: Upload pressure-test receipts
        uses: actions/upload-artifact@v4
        with:
          name: contract-b-v2-rc0-py${{ matrix.python-version }}
          path: research/contract-b-v2-minimality-rc0-20260907/ci-generated/
          if-no-files-found: error
