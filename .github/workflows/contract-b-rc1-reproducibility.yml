name: Contract B RC1 independent consumer baseline

on:
  push:
    branches:
      - research/contract-b-promotion-gate-rc1
    paths:
      - 'docs/candidates/contract-b-cal-consumer-profile-rc1.md'
      - 'experiments/contract_b_rc1_consumer_a.py'
      - 'experiments/contract_b_rc1_consumer_b.mjs'
      - 'experiments/contract_b_rc1_reproducibility.py'
      - '.github/workflows/contract-b-rc1-reproducibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apparatus RC1 branch
        uses: actions/checkout@v4

      - name: Checkout pinned Evidence Bundler research head
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: b4ca9111f5957ef7e7955e2c5024f2280ee19eb5
          path: _deps/evidence-bundler

      - name: Checkout pinned Claim Audit Lab research head
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 6acc3462dad73959ccec6bccf8407215f5274cf6
          path: _deps/claim-audit-lab

      - name: Verify exact dependency heads
        shell: bash
        run: |
          test "$(git -C _deps/evidence-bundler rev-parse HEAD)" = "b4ca9111f5957ef7e7955e2c5024f2280ee19eb5"
          test "$(git -C _deps/claim-audit-lab rev-parse HEAD)" = "6acc3462dad73959ccec6bccf8407215f5274cf6"
          git rev-parse HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install minimal input-generation dependency
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Execute baseline-only reproducibility gate
        shell: bash
        run: |
          python experiments/contract_b_rc1_reproducibility.py \
            --eb-root _deps/evidence-bundler \
            --cal-root _deps/claim-audit-lab \
            --out experiment-results/contract-b-rc1

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-b-rc1-baseline-${{ github.run_id }}
          path: experiment-results/contract-b-rc1/
          if-no-files-found: warn
