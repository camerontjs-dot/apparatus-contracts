name: Contract D 1.0.0 adversarial gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'contract-d-v1.0.0.md'
      - 'schema/contract-d/**'
      - 'fixtures/contract-d/**'
      - 'validators/contract_d_*.py'
      - 'pyproject.toml'
      - '.github/workflows/contract-d-1.0.0-adversarial.yml'
  push:
    branches:
      - promotion/contract-d-1.0.0

permissions:
  contents: read

jobs:
  adversarial-production:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@v4
      - name: Checkout frozen adversarial apparatus
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 3367037d83a3a1f9ece536406017afcab8940a92
          path: _adversarial
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact production dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Materialize adapter-free target wrappers around production modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/contract-d-production/fixtures
          cat > /tmp/contract-d-production/contract_d_core.py <<'PY'
          from validators.contract_d_core import *
          PY
          cat > /tmp/contract-d-production/contract_d_validate.py <<'PY'
          from validators.contract_d_validate import *
          PY
          cat > /tmp/contract-d-production/contract_d_consume.py <<'PY'
          from validators.contract_d_consume import *
          PY
          cp schema/contract-d/1.0.0/effect-registry.json /tmp/contract-d-production/effect-registry.json
          cp fixtures/contract-d/1.0.0/valid.json /tmp/contract-d-production/fixtures/valid.json
      - name: Self-test frozen attack apparatus
        env:
          PYTHONPATH: ${{ github.workspace }}/_adversarial/research/contract-d-adversarial-harness-v1
        run: python -m unittest -v _adversarial/research/contract-d-adversarial-harness-v1/test_harness_self.py
      - name: Attack proposed Contract D v1 production code in gate mode
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/_adversarial/research/contract-d-adversarial-harness-v1:${{ github.workspace }}
        run: |
          set -euo pipefail
          python _adversarial/research/contract-d-adversarial-harness-v1/run_rc5_harness_v3.py \
            --target /tmp/contract-d-production \
            --report-dir contract-d-v1-adversarial-report \
            --gate
          cat contract-d-v1-adversarial-report/report.md
      - name: Upload adversarial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-d-v1-adversarial-py${{ matrix.python }}-${{ github.run_id }}
          path: contract-d-v1-adversarial-report/
          if-no-files-found: error
          retention-days: 90
