name: Contract B 1.2 production acceptance

on:
  push:
    branches:
      - main
      - research/contract-e-v1-successor-rc2-dual-identity-20260902
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  production-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Apparatus promotion branch
        uses: actions/checkout@v4

      - name: Checkout pinned Evidence Bundler production main
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: c8189c31adbab11729c31430c2070126224a2d42
          path: _deps/evidence-bundler

      - name: Checkout pinned Claim Audit Lab production main
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 33a928db97316a3652d57df9cafb8ca240305233
          path: _deps/claim-audit-lab

      - name: Verify exact repository heads
        run: |
          test "$(git -C _deps/evidence-bundler rev-parse HEAD)" = "c8189c31adbab11729c31430c2070126224a2d42"
          test "$(git -C _deps/claim-audit-lab rev-parse HEAD)" = "33a928db97316a3652d57df9cafb8ca240305233"
          printf 'APPARATUS_SHA=%s\n' "$(git rev-parse HEAD)" | tee acceptance-heads.txt
          printf 'EVIDENCE_BUNDLER_SHA=%s\n' "$(git -C _deps/evidence-bundler rev-parse HEAD)" | tee -a acceptance-heads.txt
          printf 'CLAIM_AUDIT_LAB_SHA=%s\n' "$(git -C _deps/claim-audit-lab rev-parse HEAD)" | tee -a acceptance-heads.txt

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'pydantic>=2.6,<3' 'PyYAML>=6,<7' 'click>=8.1,<9' \
            'pdfminer.six>=20231228' 'pypdf>=4,<7' 'rank-bm25>=0.2.2,<0.3' \
            'typer>=0.12' 'pytest>=8,<10' 'rfc8785==0.1.4'
          python -m pip install --no-deps -e .
          python -m pip install --no-deps -e _deps/evidence-bundler
          python -m pip install --no-deps -e _deps/claim-audit-lab

      - name: Run cross-repository production gates 1-17
        run: |
          set -o pipefail
          mkdir -p production-acceptance
          python tests/contract_b_production_acceptance.py 2>&1 | tee production-acceptance/cross-repo-gates.log

      - name: Gate 18 - Apparatus production tests
        run: |
          set -o pipefail
          python -m pytest -q tests 2>&1 | tee production-acceptance/apparatus-pytest.log

      - name: Gate 19 - Evidence Bundler relevant production tests
        run: |
          set -o pipefail
          python -m pytest -q \
            _deps/evidence-bundler/tests/test_bundle_writer.py \
            _deps/evidence-bundler/tests/test_hashing.py \
            _deps/evidence-bundler/tests/test_discovery.py \
            _deps/evidence-bundler/tests/test_intake.py \
            _deps/evidence-bundler/tests/test_retrieval_bm25.py \
            2>&1 | tee production-acceptance/evidence-bundler-pytest.log

      - name: Gate 20 - Claim Audit Lab relevant production tests
        run: |
          set -o pipefail
          python -m pytest -q \
            _deps/claim-audit-lab/tests/test_cb_bundle_loader.py \
            _deps/claim-audit-lab/tests/test_cb_models.py \
            _deps/claim-audit-lab/tests/test_cb_adapter.py \
            2>&1 | tee production-acceptance/claim-audit-lab-pytest.log

      - name: Verify canonical contract distribution bytes and pins
        run: |
          cmp schema/vocabulary.yaml _deps/evidence-bundler/schema/vocabulary.yaml
          cmp schema/vocabulary.yaml _deps/claim-audit-lab/schema/vocabulary.yaml
          cmp schema/vocabulary.yaml _deps/claim-audit-lab/src/claim_audit_lab/schema/vocabulary.yaml
          test "$(cat schema/.contract-version)" = "1.2.0"
          test "$(cat _deps/evidence-bundler/schema/.contract-version)" = "1.2.0"
          test "$(cat _deps/claim-audit-lab/schema/.contract-version)" = "1.2.0"
          test "$(cat _deps/claim-audit-lab/src/claim_audit_lab/schema/.contract-version)" = "1.2.0"

      - name: Upload production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-b-1.2-production-acceptance-${{ github.run_id }}
          path: |
            acceptance-heads.txt
            production-acceptance/
          if-no-files-found: warn
          retention-days: 90

  research-contract-e-rc2-candidate:
    name: Research Contract E RC2 candidate (Python ${{ matrix.python }})
    if: github.ref == 'refs/heads/research/contract-e-v1-successor-rc2-dual-identity-20260902'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RC2 experiment branch
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate RC2 schema
        run: python -m json.tool docs/research/contract-e/v1-closure-20260902/successor-rc2/candidate/schema.json >/dev/null
      - name: Compile RC2 reference and matrix
        run: |
          python -m py_compile \
            docs/research/contract-e/v1-closure-20260902/successor-rc2/candidate/reference.py \
            docs/research/contract-e/v1-closure-20260902/successor-rc2/candidate/test_candidate.py
      - name: Execute preregistered RC2 core matrix
        working-directory: docs/research/contract-e/v1-closure-20260902/successor-rc2/candidate
        run: python test_candidate.py
      - name: Upload RC2 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-e-rc2-candidate-py${{ matrix.python }}
          path: docs/research/contract-e/v1-closure-20260902/successor-rc2/candidate/RESULTS.json
          if-no-files-found: warn
          retention-days: 90
