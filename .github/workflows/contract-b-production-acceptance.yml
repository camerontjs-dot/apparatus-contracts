name: Contract B 1.2 production acceptance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  production-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Apparatus promotion branch
        uses: actions/checkout@v4

      - name: Checkout pinned Evidence Bundler production main
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: c8189c31adbab11729c31430c2070126224a2d42
          path: _deps/evidence-bundler

      - name: Checkout pinned Claim Audit Lab production main
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 33a928db97316a3652d57df9cafb8ca240305233
          path: _deps/claim-audit-lab

      - name: Verify exact repository heads
        run: |
          test "$(git -C _deps/evidence-bundler rev-parse HEAD)" = "c8189c31adbab11729c31430c2070126224a2d42"
          test "$(git -C _deps/claim-audit-lab rev-parse HEAD)" = "33a928db97316a3652d57df9cafb8ca240305233"
          printf 'APPARATUS_SHA=%s\n' "$(git rev-parse HEAD)" | tee acceptance-heads.txt
          printf 'EVIDENCE_BUNDLER_SHA=%s\n' "$(git -C _deps/evidence-bundler rev-parse HEAD)" | tee -a acceptance-heads.txt
          printf 'CLAIM_AUDIT_LAB_SHA=%s\n' "$(git -C _deps/claim-audit-lab rev-parse HEAD)" | tee -a acceptance-heads.txt

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'pydantic>=2.6,<3' 'PyYAML>=6,<7' 'click>=8.1,<9' \
            'pdfminer.six>=20231228' 'pypdf>=4,<7' 'rank-bm25>=0.2.2,<0.3' \
            'typer>=0.12' 'pytest>=8,<10' 'rfc8785==0.1.4'
          python -m pip install --no-deps -e .
          python -m pip install --no-deps -e _deps/evidence-bundler
          python -m pip install --no-deps -e _deps/claim-audit-lab

      - name: Run cross-repository production gates 1-17
        run: |
          set -o pipefail
          mkdir -p production-acceptance
          python tests/contract_b_production_acceptance.py 2>&1 | tee production-acceptance/cross-repo-gates.log

      - name: Gate 18 - Apparatus production tests
        run: |
          set -o pipefail
          python -m pytest -q tests 2>&1 | tee production-acceptance/apparatus-pytest.log

      - name: Gate 19 - Evidence Bundler relevant production tests
        run: |
          set -o pipefail
          python -m pytest -q \
            _deps/evidence-bundler/tests/test_bundle_writer.py \
            _deps/evidence-bundler/tests/test_hashing.py \
            _deps/evidence-bundler/tests/test_discovery.py \
            _deps/evidence-bundler/tests/test_intake.py \
            _deps/evidence-bundler/tests/test_retrieval_bm25.py \
            2>&1 | tee production-acceptance/evidence-bundler-pytest.log

      - name: Gate 20 - Claim Audit Lab relevant production tests
        run: |
          set -o pipefail
          python -m pytest -q \
            _deps/claim-audit-lab/tests/test_cb_bundle_loader.py \
            _deps/claim-audit-lab/tests/test_cb_models.py \
            _deps/claim-audit-lab/tests/test_cb_adapter.py \
            2>&1 | tee production-acceptance/claim-audit-lab-pytest.log

      - name: Verify canonical contract distribution bytes and pins
        run: |
          cmp schema/vocabulary.yaml _deps/evidence-bundler/schema/vocabulary.yaml
          cmp schema/vocabulary.yaml _deps/claim-audit-lab/schema/vocabulary.yaml
          cmp schema/vocabulary.yaml _deps/claim-audit-lab/src/claim_audit_lab/schema/vocabulary.yaml
          test "$(cat schema/.contract-version)" = "1.2.0"
          test "$(cat _deps/evidence-bundler/schema/.contract-version)" = "1.2.0"
          test "$(cat _deps/claim-audit-lab/schema/.contract-version)" = "1.2.0"
          test "$(cat _deps/claim-audit-lab/src/claim_audit_lab/schema/.contract-version)" = "1.2.0"

      - name: Upload production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-b-1.2-production-acceptance-${{ github.run_id }}
          path: |
            acceptance-heads.txt
            production-acceptance/
          if-no-files-found: warn
          retention-days: 90

  research-d-to-e-authorization-pressure:
    name: Research D→E authorization pressure (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout experiment head
        uses: actions/checkout@v4
        with:
          path: experiment

      - name: Checkout exact Contract D 1.0.0 release
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
          path: contract-d

      - name: Checkout exact frozen Contract E RC1 candidate
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 8876b7bcc2afa1a4902400b0cc507cf2ef02e6e7
          path: contract-e

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install exact Contract D canonicalization dependency
        run: python -m pip install --disable-pip-version-check 'rfc8785==0.1.4'

      - name: Verify frozen authorities and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C contract-d rev-parse HEAD)" = "298a1a0f7b7b6d7712e11200d04faec3e1ca169b"
          test "$(git -C contract-e rev-parse HEAD)" = "8876b7bcc2afa1a4902400b0cc507cf2ef02e6e7"
          test "$(git -C contract-d hash-object validators/contract_d_core.py)" = "564dcde5677df5ac8f86f21dc0ffd1692f44c9f0"
          test "$(git -C contract-d hash-object validators/contract_d_consume.py)" = "8b4ad5c9d6fc1145cf334d1416b5d52b9ed93c68"
          test "$(git -C contract-d hash-object schema/contract-d/1.0.0/effect-registry.json)" = "a40f4f4447470654bdc16d852f5927189ae30cc5"
          test "$(git -C contract-d hash-object fixtures/contract-d/1.0.0/valid.json)" = "66f59bc50e5062aa8550491defa2fee37e75fcc7"
          test "$(git -C contract-e hash-object docs/research/contract-e/v1-closure-20260902/candidate/SPEC.md)" = "3041d31ed0905d50ff355e483fbb9422df994997"
          test "$(git -C contract-e hash-object docs/research/contract-e/v1-closure-20260902/candidate/schema.json)" = "d934d055e39c81e6eb93830e7c6f6f43fc8a0870"
          test "$(git -C contract-e hash-object docs/research/contract-e/v1-closure-20260902/candidate/reference.py)" = "378cdb7835df3959c82a0fe98068b1434b1b68ec"

      - name: Compile frozen experiment harness
        run: python -m py_compile experiment/docs/research/contract-e/d-to-e-authorization-consumer-pressure-20260902/attack_matrix.py

      - name: Execute preregistered attack matrix
        run: |
          mkdir -p "experiment/build/d-to-e-authz-pressure/py${{ matrix.python }}"
          python experiment/docs/research/contract-e/d-to-e-authorization-consumer-pressure-20260902/attack_matrix.py \
            --contract-d-root contract-d \
            --contract-e-root contract-e \
            --output "experiment/build/d-to-e-authz-pressure/py${{ matrix.python }}/RESULTS.json"

      - name: Verify frozen checkouts remain unmodified
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C contract-d status --porcelain)"
          test -z "$(git -C contract-e status --porcelain)"

      - name: Upload pressure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d-to-e-authorization-consumer-pressure-py${{ matrix.python }}
          path: experiment/build/d-to-e-authz-pressure/py${{ matrix.python }}/RESULTS.json
          if-no-files-found: warn
          retention-days: 90
