name: Research - Contract E RC2 Canonicalization Probe

on:
  push:
    branches:
      - research/contract-e-v1-successor-rc2-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent canonicalizer
        run: python -m pip install --disable-pip-version-check 'rfc8785==0.1.4'
      - name: Run malformed-state canonicalization discriminator
        shell: bash
        run: |
          set -o pipefail
          python docs/research/contract-e/v1-successor-rc2-20260902/canonicalization_probe.py | tee RC2-CANONICALIZATION-PROBE.json
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-e-rc2-canonicalization-probe-${{ github.run_id }}
          path: RC2-CANONICALIZATION-PROBE.json
          if-no-files-found: warn
          retention-days: 90
