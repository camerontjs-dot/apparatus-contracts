name: Contract A minimality RC2 research

on:
  pull_request:
    branches:
      - main
    paths:
      - 'research/contract-a-minimality-rc2-20260901/**'
      - '.github/workflows/contract-a-minimality-rc2.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  minimality-conformance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Apparatus research branch
        uses: actions/checkout@v4
        with:
          # The ancestry gate below intentionally names the exact production base.
          # Fetch history so that SHA remains addressable when pull_request checks
          # run on GitHub's synthetic merge commit.
          fetch-depth: 0

      - name: Checkout pinned Research Scaffold Harness
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/research-scaffold-harness
          ref: 548bfa81f65290eda15af658f647497679b840ef
          path: _deps/research-scaffold-harness

      - name: Checkout pinned Evidence Bundler
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: 6011789957f3294f97bff260069cfb5bb1c5772f
          path: _deps/evidence-bundler

      - name: Checkout pinned Claim Audit Lab
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 53f0885b111676794d1bd20e10b91aa58b07e9d4
          path: _deps/claim-audit-lab

      - name: Record exact heads
        run: |
          mkdir -p research/contract-a-minimality-rc2-20260901/evidence
          {
            printf 'APPARATUS_RESEARCH_HEAD=%s\n' "$(git rev-parse HEAD)"
            printf 'APPARATUS_LIVE_MAIN_BASE=6a45ab2de09370f3048ffb083e25b487f81117e4\n'
            printf 'RESEARCH_SCAFFOLD_HARNESS_SHA=%s\n' "$(git -C _deps/research-scaffold-harness rev-parse HEAD)"
            printf 'EVIDENCE_BUNDLER_SHA=%s\n' "$(git -C _deps/evidence-bundler rev-parse HEAD)"
            printf 'CLAIM_AUDIT_LAB_SHA=%s\n' "$(git -C _deps/claim-audit-lab rev-parse HEAD)"
          } | tee research/contract-a-minimality-rc2-20260901/evidence/heads.txt
          test "$(git -C _deps/research-scaffold-harness rev-parse HEAD)" = "548bfa81f65290eda15af658f647497679b840ef"
          test "$(git -C _deps/evidence-bundler rev-parse HEAD)" = "6011789957f3294f97bff260069cfb5bb1c5772f"
          test "$(git -C _deps/claim-audit-lab rev-parse HEAD)" = "53f0885b111676794d1bd20e10b91aa58b07e9d4"
          git merge-base --is-ancestor 6a45ab2de09370f3048ffb083e25b487f81117e4 HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'pydantic>=2.6,<3' 'PyYAML>=6,<7' 'click>=8.1,<9' \
            'pdfminer.six>=20231228' 'pypdf>=4,<7' 'rank-bm25>=0.2.2,<0.3' \
            'typer>=0.12' 'pytest>=8,<10' 'rfc8785==0.1.4' \
            'spacy>=3.7' 'quantulum3>=0.4'
          python -m pip install --no-deps -e .
          python -m pip install --no-deps -e _deps/research-scaffold-harness
          python -m pip install --no-deps -e _deps/evidence-bundler
          python -m pip install --no-deps -e _deps/claim-audit-lab

      - name: Validate public candidate and positive/negative fixtures
        run: |
          set -o pipefail
          cd research/contract-a-minimality-rc2-20260901/candidate
          python test_candidate.py 2>&1 | tee ../evidence/candidate-conformance.log

      - name: Run pinned cross-repository minimality experiment
        run: |
          set -o pipefail
          python research/contract-a-minimality-rc2-20260901/reference/run_conformance_v3.py \
            2>&1 | tee research/contract-a-minimality-rc2-20260901/evidence/cross-repo-conformance.log

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-a-minimality-rc2-${{ github.run_id }}
          path: research/contract-a-minimality-rc2-20260901/evidence/
          if-no-files-found: error
          retention-days: 90
