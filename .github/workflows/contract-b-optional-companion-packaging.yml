name: Contract B optional companion packaging control

on:
  push:
    branches:
      - research/contract-b-optional-extension-minimality
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Apparatus research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Evidence Bundler
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: b4ca9111f5957ef7e7955e2c5024f2280ee19eb5
          path: _deps/evidence-bundler

      - name: Checkout pinned Claim Audit Lab
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 6acc3462dad73959ccec6bccf8407215f5274cf6
          path: _deps/claim-audit-lab

      - name: Verify exact research ancestry and pins
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f4ee2dbd853821ba54328156bbab1c71235fae55 HEAD
          git merge-base --is-ancestor 63e8506396132a44ebc0e6c2312047e99b1125eb HEAD
          test "$(git -C _deps/evidence-bundler rev-parse HEAD)" = "b4ca9111f5957ef7e7955e2c5024f2280ee19eb5"
          test "$(git -C _deps/claim-audit-lab rev-parse HEAD)" = "6acc3462dad73959ccec6bccf8407215f5274cf6"
          mkdir -p experiment-results/contract-b-optional-extension-minimality
          {
            echo "apparatus_experiment=$(git rev-parse HEAD)"
            echo "evidence_bundler=$(git -C _deps/evidence-bundler rev-parse HEAD)"
            echo "claim_audit_lab=$(git -C _deps/claim-audit-lab rev-parse HEAD)"
          } | tee experiment-results/contract-b-optional-extension-minimality/packaging-pins.txt

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run bound companion packaging control
        id: packaging
        shell: bash
        env:
          EB_ROOT: ${{ github.workspace }}/_deps/evidence-bundler
          CAL_ROOT: ${{ github.workspace }}/_deps/claim-audit-lab
          RESULTS_DIR: ${{ github.workspace }}/experiment-results/contract-b-optional-extension-minimality
        run: |
          set -o pipefail
          python experiments/contract_b_optional_packaging_control.py \
            2>&1 | tee experiment-results/contract-b-optional-extension-minimality/packaging-control.log

      - name: Emit packaging evidence
        if: always()
        shell: bash
        run: |
          if test -f experiment-results/contract-b-optional-extension-minimality/packaging-control.json; then
            cat experiment-results/contract-b-optional-extension-minimality/packaging-control.json
          fi

      - name: Upload packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-b-optional-packaging-${{ github.run_id }}
          path: experiment-results/contract-b-optional-extension-minimality/
          if-no-files-found: error
          retention-days: 90
