name: Research Contract E v1 RC3 candidate

on:
  push:
    branches:
      - research/contract-e-v1-rc3-exact-currentness-jcs-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: RC3 candidate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact canonicalization dependency
        run: python -m pip install --disable-pip-version-check 'rfc8785==0.1.4'
      - name: Capture candidate identities
        shell: bash
        run: |
          set -euo pipefail
          base="docs/research/contract-e/v1-rc3-exact-currentness-jcs-20260902/candidate"
          git hash-object "$base/SPEC.md"
          git hash-object "$base/schema.json"
          git hash-object "$base/reference.py"
          git hash-object "$base/test_candidate.py"
          sha256sum "$base/SPEC.md" "$base/schema.json" "$base/reference.py" "$base/test_candidate.py"
      - name: Run RC3 candidate suite
        shell: bash
        run: |
          set -euo pipefail
          cd docs/research/contract-e/v1-rc3-exact-currentness-jcs-20260902/candidate
          python test_candidate.py

  integration-pressure:
    name: Frozen D-to-E pressure (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout RC3 research branch
        uses: actions/checkout@v4
        with:
          path: experiment
      - name: Checkout exact Contract D 1.0.0
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
          path: contract-d
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact canonicalization dependency
        run: python -m pip install --disable-pip-version-check 'rfc8785==0.1.4'
      - name: Verify released Contract D and frozen pressure bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C contract-d rev-parse HEAD)" = "298a1a0f7b7b6d7712e11200d04faec3e1ca169b"
          test "$(git -C contract-d hash-object validators/contract_d_core.py)" = "564dcde5677df5ac8f86f21dc0ffd1692f44c9f0"
          test "$(git -C contract-d hash-object validators/contract_d_consume.py)" = "8b4ad5c9d6fc1145cf334d1416b5d52b9ed93c68"
          root="docs/research/contract-e/v1-rc3-exact-currentness-jcs-20260902"
          test "$(git -C experiment hash-object "$root/integration_profile.py")" = "6f19875d4f21765e02d51fef50ca53fae3daf177"
          test "$(git -C experiment hash-object "$root/test_integration_profile.py")" = "7c84806033a80b93c08d51492dce265a29dc2b40"
          test "$(git -C experiment hash-object "$root/run_integration_superset.py")" = "8cd53b679f39f6b08a5184eb3133f3c7d610eb2c"
      - name: Compile candidate and frozen pressure harness
        run: |
          python -m py_compile \
            experiment/docs/research/contract-e/v1-rc3-exact-currentness-jcs-20260902/candidate/reference.py \
            experiment/docs/research/contract-e/v1-rc3-exact-currentness-jcs-20260902/integration_profile.py \
            experiment/docs/research/contract-e/v1-rc3-exact-currentness-jcs-20260902/test_integration_profile.py \
            experiment/docs/research/contract-e/v1-rc3-exact-currentness-jcs-20260902/run_integration_superset.py
      - name: Run frozen trusted-origin and point-of-use pressure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "experiment/build/contract-e-rc3/py${{ matrix.python-version }}"
          python experiment/docs/research/contract-e/v1-rc3-exact-currentness-jcs-20260902/run_integration_superset.py \
            --contract-d-root contract-d \
            --output "experiment/build/contract-e-rc3/py${{ matrix.python-version }}/INTEGRATION_RESULTS.json" \
            | tee "experiment/build/contract-e-rc3/py${{ matrix.python-version }}/integration.log"
      - name: Verify tracked sources remain unmodified
        shell: bash
        run: |
          set -euo pipefail
          git -C experiment diff --exit-code
          git -C contract-d diff --exit-code
      - name: Upload RC3 integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-e-rc3-integration-py${{ matrix.python-version }}
          path: experiment/build/contract-e-rc3/py${{ matrix.python-version }}/
          if-no-files-found: warn
          retention-days: 90
