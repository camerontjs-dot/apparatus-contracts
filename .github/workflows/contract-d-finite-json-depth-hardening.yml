name: Contract D finite-JSON depth hardening

on:
  push:
    branches:
      - research/contract-d-finite-json-depth-hardening-v1
  workflow_dispatch:

jobs:
  discriminate:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify frozen predecessor candidate identity
        shell: bash
        run: |
          set -euo pipefail
          # Run 33348487547 is preserved as a harness failure: it attempted an
          # ancestry check against history absent from a depth-1 checkout.
          # The experiment only needs proof that the inherited frozen candidate
          # itself is byte/tree-identical at the current research head.
          test "$(git rev-parse 'HEAD:research/contract-d-independent-authority-rc4/candidate')" = 'fe449f9ec27eeddb434276ded375f9dc16b48e29'
          test "$(git rev-parse 'HEAD:research/contract-d-independent-authority-rc4/candidate/contract_d_core.py')" = '589e3f1c31a21d305402e5750605d25be682a336'
          test "$(git rev-parse 'HEAD:research/contract-d-independent-authority-rc4/candidate/contract_d_validate.py')" = 'd9d621df1e817adbb5468be25ef65272c457e8cc'
          test "$(git rev-parse 'HEAD:research/contract-d-independent-authority-rc4/candidate/contract_d_consume.py')" = 'ad5126922ea4dd8a38df6c08f53e3bc687f2c4d4'

      - name: Run catch-only versus iterative discriminator
        shell: bash
        env:
          PYTHONPATH: research/contract-d-finite-json-depth-hardening-v1
        run: |
          set -euo pipefail
          python research/contract-d-finite-json-depth-hardening-v1/run_experiment.py

      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-d-depth-hardening-py${{ matrix.python }}
          path: research/contract-d-finite-json-depth-hardening-v1/results/
          if-no-files-found: error
