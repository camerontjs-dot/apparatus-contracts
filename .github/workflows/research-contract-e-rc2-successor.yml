name: Research - Contract E RC2 Successor

on:
  push:
    branches:
      - research/contract-e-v1-successor-rc2-dual-identity-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: RC2 candidate matrix (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate frozen schema JSON
        run: python -m json.tool docs/research/contract-e/v1-closure-20260902/successor-rc2/candidate/schema.json >/dev/null
      - name: Compile reference and tests
        run: |
          python -m py_compile \
            docs/research/contract-e/v1-closure-20260902/successor-rc2/candidate/reference.py \
            docs/research/contract-e/v1-closure-20260902/successor-rc2/candidate/test_candidate.py
      - name: Execute preregistered RC2 core matrix
        working-directory: docs/research/contract-e/v1-closure-20260902/successor-rc2/candidate
        run: python test_candidate.py
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-e-rc2-candidate-py${{ matrix.python }}
          path: docs/research/contract-e/v1-closure-20260902/successor-rc2/candidate/RESULTS.json
          if-no-files-found: warn
          retention-days: 90

  trusted-origin-pressure:
    name: RC2 D→E trusted-origin pressure (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RC2 experiment branch
        uses: actions/checkout@v4
        with:
          path: experiment
      - name: Checkout exact Contract D 1.0.0 release
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
          path: contract-d
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact Contract D canonicalization dependency
        run: python -m pip install --disable-pip-version-check 'rfc8785==0.1.4'
      - name: Verify released Contract D authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C contract-d rev-parse HEAD)" = "298a1a0f7b7b6d7712e11200d04faec3e1ca169b"
          test "$(git -C contract-d hash-object validators/contract_d_core.py)" = "564dcde5677df5ac8f86f21dc0ffd1692f44c9f0"
          test "$(git -C contract-d hash-object validators/contract_d_consume.py)" = "8b4ad5c9d6fc1145cf334d1416b5d52b9ed93c68"
          test "$(git -C contract-d hash-object schema/contract-d/1.0.0/effect-registry.json)" = "a40f4f4447470654bdc16d852f5927189ae30cc5"
      - name: Compile pressure harness
        run: python -m py_compile experiment/docs/research/contract-e/v1-closure-20260902/successor-rc2/profile_pressure.py
      - name: Execute preregistered D→E trusted-origin pressure
        run: |
          mkdir -p "experiment/build/contract-e-rc2-profile/py${{ matrix.python }}"
          python experiment/docs/research/contract-e/v1-closure-20260902/successor-rc2/profile_pressure.py \
            --contract-d-root contract-d \
            --contract-e-reference experiment/docs/research/contract-e/v1-closure-20260902/successor-rc2/candidate/reference.py \
            --output "experiment/build/contract-e-rc2-profile/py${{ matrix.python }}/PROFILE_RESULTS.json"
      - name: Verify released D checkout unchanged
        run: test -z "$(git -C contract-d status --porcelain)"
      - name: Upload pressure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-e-rc2-profile-pressure-py${{ matrix.python }}
          path: experiment/build/contract-e-rc2-profile/py${{ matrix.python }}/PROFILE_RESULTS.json
          if-no-files-found: warn
          retention-days: 90

  evaluator-qualification:
    name: RC2 fresh evaluator qualification before independent implementation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RC2 branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: apparatus
      - name: Checkout exact Contract D 1.0.0 release
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
          path: contract-d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Contract D canonicalization dependency
        run: python -m pip install --disable-pip-version-check 'rfc8785==0.1.4'
      - name: Verify frozen RC2 candidate bytes remain exact
        shell: bash
        run: |
          set -euo pipefail
          freeze='3a206729f53672fb28a711980925a24c77e6910a'
          root='docs/research/contract-e/v1-closure-20260902/successor-rc2'
          test "$(git -C apparatus rev-parse "${freeze}:${root}/candidate/SPEC.md")" = 'f05b679a30bafb8a08eef175ecefdb4a38245c9c'
          test "$(git -C apparatus rev-parse "${freeze}:${root}/candidate/schema.json")" = '42df79ff2c55fb5eaed9e880648abd87d6c20413'
          test "$(git -C apparatus rev-parse "${freeze}:${root}/candidate/reference.py")" = '98e3bf38dd1fb6028231a7f6b5c2459b387909c6'
          test "$(git -C apparatus rev-parse "${freeze}:${root}/candidate/test_candidate.py")" = '52c1ff54032b0ee02f00d9abb3e6ac5c3595340e'
          test "$(git -C apparatus rev-parse "${freeze}:${root}/D-TO-E-TRUSTED-ORIGIN-PROFILE.md")" = '896b4a8494d9bd19d3e0f7d80ef34e6c214c54e6'
          test "$(git -C apparatus rev-parse "${freeze}:${root}/EXPERIMENT-PREREGISTRATION.md")" = 'a6fb67b598c50df37035b198f74105c6ae008db2'
          test "$(git -C apparatus rev-parse "${freeze}:${root}/profile_pressure.py")" = 'cea77f3c06b339192c946ad81d9c9ca1dbd89bd3'
          test "$(git -C apparatus hash-object "${root}/candidate/SPEC.md")" = 'f05b679a30bafb8a08eef175ecefdb4a38245c9c'
          test "$(git -C apparatus hash-object "${root}/candidate/schema.json")" = '42df79ff2c55fb5eaed9e880648abd87d6c20413'
          test "$(git -C apparatus hash-object "${root}/candidate/reference.py")" = '98e3bf38dd1fb6028231a7f6b5c2459b387909c6'
          test "$(git -C apparatus hash-object "${root}/candidate/test_candidate.py")" = '52c1ff54032b0ee02f00d9abb3e6ac5c3595340e'
          test "$(git -C apparatus hash-object "${root}/D-TO-E-TRUSTED-ORIGIN-PROFILE.md")" = '896b4a8494d9bd19d3e0f7d80ef34e6c214c54e6'
          test "$(git -C apparatus hash-object "${root}/EXPERIMENT-PREREGISTRATION.md")" = 'a6fb67b598c50df37035b198f74105c6ae008db2'
          test "$(git -C apparatus hash-object "${root}/profile_pressure.py")" = 'cea77f3c06b339192c946ad81d9c9ca1dbd89bd3'
      - name: Generate current trusted-origin qualification evidence
        run: |
          mkdir -p apparatus/build/contract-e-rc2-qualification
          python apparatus/docs/research/contract-e/v1-closure-20260902/successor-rc2/profile_pressure.py \
            --contract-d-root contract-d \
            --contract-e-reference apparatus/docs/research/contract-e/v1-closure-20260902/successor-rc2/candidate/reference.py \
            --output apparatus/build/contract-e-rc2-qualification/PROFILE_RESULTS.json
      - name: Compile evaluator apparatus
        run: |
          python -m py_compile \
            apparatus/sealed/contract-e-v1-fresh-rc2/hidden_cases.py \
            apparatus/sealed/contract-e-v1-fresh-rc2/evaluate_fresh.py \
            apparatus/sealed/contract-e-v1-fresh-rc2/qualify.py
      - name: Qualify evaluator and seeded weak controls
        run: |
          python apparatus/sealed/contract-e-v1-fresh-rc2/qualify.py \
            --profile-results apparatus/build/contract-e-rc2-qualification/PROFILE_RESULTS.json \
            --output apparatus/build/contract-e-rc2-qualification/QUALIFICATION_RESULTS.json
      - name: Verify no frozen authority checkout mutation
        run: test -z "$(git -C contract-d status --porcelain)"
      - name: Upload evaluator qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-e-rc2-evaluator-qualification-${{ github.sha }}
          path: |
            apparatus/build/contract-e-rc2-qualification/QUALIFICATION_RESULTS.json
            apparatus/build/contract-e-rc2-qualification/PROFILE_RESULTS.json
          if-no-files-found: warn
          retention-days: 90
