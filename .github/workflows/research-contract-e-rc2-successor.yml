name: Research - Contract E RC2 Successor

on:
  push:
    branches:
      - research/contract-e-v1-successor-rc2-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc2-successor:
    name: RC2 successor pressure (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RC2 research branch
        uses: actions/checkout@v4
        with:
          path: experiment

      - name: Checkout exact Contract D 1.0.0 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
          path: contract-d

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install exact Contract D canonicalization dependency
        run: python -m pip install --disable-pip-version-check 'rfc8785==0.1.4'

      - name: Verify exact released Contract D authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C contract-d rev-parse HEAD)" = "298a1a0f7b7b6d7712e11200d04faec3e1ca169b"
          test "$(git -C contract-d hash-object validators/contract_d_core.py)" = "564dcde5677df5ac8f86f21dc0ffd1692f44c9f0"
          test "$(git -C contract-d hash-object validators/contract_d_consume.py)" = "8b4ad5c9d6fc1145cf334d1416b5d52b9ed93c68"
          test "$(git -C contract-d hash-object schema/contract-d/1.0.0/effect-registry.json)" = "a40f4f4447470654bdc16d852f5927189ae30cc5"
          test "$(git -C contract-d hash-object fixtures/contract-d/1.0.0/valid.json)" = "66f59bc50e5062aa8550491defa2fee37e75fcc7"

      - name: Validate RC2 machine schema
        run: python -m json.tool experiment/docs/research/contract-e/v1-successor-rc2-20260902/candidate/schema.json >/dev/null

      - name: Compile RC2 candidate and integration profile
        run: |
          python -m py_compile \
            experiment/docs/research/contract-e/v1-successor-rc2-20260902/candidate/reference.py \
            experiment/docs/research/contract-e/v1-successor-rc2-20260902/candidate/test_candidate.py \
            experiment/docs/research/contract-e/v1-successor-rc2-20260902/integration_profile.py \
            experiment/docs/research/contract-e/v1-successor-rc2-20260902/test_integration_profile.py \
            experiment/docs/research/contract-e/v1-successor-rc2-20260902/run_integration_superset.py

      - name: Run RC2 core regression/adversarial suite
        shell: bash
        run: |
          set -euo pipefail
          cd experiment/docs/research/contract-e/v1-successor-rc2-20260902/candidate
          python test_candidate.py | tee ../../../../../build-rc2-core.txt

      - name: Run trusted-origin and point-of-use integration pressure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "experiment/build/contract-e-rc2/py${{ matrix.python }}"
          python experiment/docs/research/contract-e/v1-successor-rc2-20260902/run_integration_superset.py \
            --contract-d-root contract-d \
            --output "experiment/build/contract-e-rc2/py${{ matrix.python }}/INTEGRATION_RESULTS.json" \
            | tee "experiment/build/contract-e-rc2/py${{ matrix.python }}/integration.log"

      - name: Capture exact candidate identities
        shell: bash
        run: |
          set -euo pipefail
          root='experiment/docs/research/contract-e/v1-successor-rc2-20260902'
          {
            printf 'HEAD=%s\n' "$(git -C experiment rev-parse HEAD)"
            sha256sum \
              "$root/PREREGISTRATION.md" \
              "$root/candidate/SPEC.md" \
              "$root/candidate/schema.json" \
              "$root/candidate/reference.py" \
              "$root/candidate/test_candidate.py" \
              "$root/integration_profile.py" \
              "$root/test_integration_profile.py" \
              "$root/run_integration_superset.py" \
              "$root/APPARATUS-DEVIATIONS.md"
          } > "experiment/build/contract-e-rc2/py${{ matrix.python }}/IDENTITIES.txt"

      - name: Verify tracked source and frozen Contract D remain unmodified
        shell: bash
        run: |
          set -euo pipefail
          git -C experiment diff --exit-code
          git -C contract-d diff --exit-code

      - name: Upload RC2 successor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-e-rc2-successor-py${{ matrix.python }}
          path: |
            experiment/build/contract-e-rc2/py${{ matrix.python }}/
            experiment/build-rc2-core.txt
          if-no-files-found: warn
          retention-days: 90
