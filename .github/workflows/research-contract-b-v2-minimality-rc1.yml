name: Research Contract B v2 minimality RC1

on:
  pull_request:
    paths:
      - "research/contract-b-v2-minimality-rc0-20260907/**"
      - ".github/workflows/research-contract-b-v2-minimality-rc1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-contract-b-v2-rc1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pressure-test:
    name: rc1-pressure-py${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout exact RC1 research head
        uses: actions/checkout@v4

      - name: Record execution identity
        shell: bash
        run: |
          set -o pipefail
          mkdir -p research/contract-b-v2-minimality-rc0-20260907/ci-generated-rc1
          printf 'CHECKOUT_SHA=%s\n' "$(git rev-parse HEAD)" | tee research/contract-b-v2-minimality-rc0-20260907/ci-generated-rc1/IDENTITY_PY${{ matrix.python-version }}.txt
          printf 'CHECKOUT_TREE=%s\n' "$(git rev-parse HEAD^{tree})" | tee -a research/contract-b-v2-minimality-rc0-20260907/ci-generated-rc1/IDENTITY_PY${{ matrix.python-version }}.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install apparatus contracts
        run: python -m pip install -e ".[dev]"

      - name: Reproduce frozen RC0 negative controls
        shell: bash
        run: |
          set -o pipefail
          pytest -q research/contract-b-v2-minimality-rc0-20260907/test_rc0_counterexamples.py \
            2>&1 | tee research/contract-b-v2-minimality-rc0-20260907/ci-generated-rc1/RC0_NEGATIVE_CONTROLS_PY${{ matrix.python-version }}.txt

      - name: Run Contract B v2 RC1 successor pressure tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q research/contract-b-v2-minimality-rc0-20260907/test_candidate_rc1.py \
            2>&1 | tee research/contract-b-v2-minimality-rc0-20260907/ci-generated-rc1/RC1_PRESSURE_TEST_PY${{ matrix.python-version }}.txt

      - name: Ordinary Apparatus regression
        shell: bash
        run: |
          set -o pipefail
          pytest -q tests \
            2>&1 | tee research/contract-b-v2-minimality-rc0-20260907/ci-generated-rc1/APPARATUS_REGRESSION_PY${{ matrix.python-version }}.txt

      - name: Static research hygiene (advisory)
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check \
            research/contract-b-v2-minimality-rc0-20260907/candidate_rc1.py \
            research/contract-b-v2-minimality-rc0-20260907/consumer_projection.py \
            research/contract-b-v2-minimality-rc0-20260907/test_candidate_rc1.py \
            research/contract-b-v2-minimality-rc0-20260907/test_rc0_counterexamples.py \
            2>&1 | tee research/contract-b-v2-minimality-rc0-20260907/ci-generated-rc1/RUFF_PY${{ matrix.python-version }}.txt

      - name: Record advisory hygiene outcome
        if: always()
        shell: bash
        run: |
          printf 'RUFF_OUTCOME=%s\n' '${{ steps.ruff.outcome }}' | tee research/contract-b-v2-minimality-rc0-20260907/ci-generated-rc1/RUFF_OUTCOME_PY${{ matrix.python-version }}.txt
          printf '%s\n' 'Run 34146137099 established that current Ruff findings are mechanical import/noqa/annotation hygiene only; they are preserved as non-scientific evidence debt and do not relax any RC1 semantic or conformance assertion.' | tee -a research/contract-b-v2-minimality-rc0-20260907/ci-generated-rc1/RUFF_OUTCOME_PY${{ matrix.python-version }}.txt

      - name: Assert no CAL dependency in RC1 implementation
        shell: bash
        run: |
          set -o pipefail
          if grep -n -E 'claim_audit_lab|audit_claims|from[[:space:]]+claim_audit_lab|import[[:space:]]+claim_audit_lab' \
            research/contract-b-v2-minimality-rc0-20260907/candidate_rc1.py \
            research/contract-b-v2-minimality-rc0-20260907/consumer_projection.py \
            research/contract-b-v2-minimality-rc0-20260907/test_candidate_rc1.py \
            research/contract-b-v2-minimality-rc0-20260907/test_rc0_counterexamples.py; then
            echo "CAL dependency found" >&2
            exit 1
          fi
          echo "NO_CAL_DEPENDENCY" | tee research/contract-b-v2-minimality-rc0-20260907/ci-generated-rc1/NO_CAL_DEPENDENCY_PY${{ matrix.python-version }}.txt

      - name: Upload RC1 pressure-test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-b-v2-rc1-py${{ matrix.python-version }}
          path: research/contract-b-v2-minimality-rc0-20260907/ci-generated-rc1/
          if-no-files-found: error
          retention-days: 90
