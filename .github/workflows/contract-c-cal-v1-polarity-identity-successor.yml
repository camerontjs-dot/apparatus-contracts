name: Contract C CAL polarity identity successor RC0

on:
  push:
    branches:
      - research/contract-c-cal-v1-polarity-identity-successor-rc0-20261003
  pull_request:
    branches:
      - promotion/contract-c-cal-v1-parent-bound-candidate-freeze-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout research subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen evaluator and candidate identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/contract_c_cal_v1_polarity_identity_successor_rc0_20261003/evaluate.py)" = "210264fe1a8b6c78d2941dc014d870eef204a12c"
          test "$(git rev-parse HEAD:research/contract_c_cal_v1_polarity_identity_successor_rc0_20261003/candidate_rc0.py)" = "f51002460fbca779e5cb16fdf21bc18ec84a7f38"

      - name: Checkout exact CAL polarity successor
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 86b60022420a006358fde38b20a204ffe4df1a96
          path: _cal_successor
          fetch-depth: 1

      - name: Checkout frozen CAL integration fixture source
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: e24e405f5336ee024674f39dba97255bb58a2dd9
          path: _cal_fixture
          fetch-depth: 1

      - name: Checkout frozen Evidence Bundler
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: 4e1f6fe00e7c350b28f52bfea14f1f8988847884
          path: _eb
          fetch-depth: 1

      - name: Checkout exact Candidate A RC2 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: b42c827acb0a9fe65353354d709add0e27bab307
          path: _c2
          fetch-depth: 1

      - name: Checkout exact resolver authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 1d33e0612befcf8016816197c90c062373796df9
          path: _resolver_repo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pydantic PyYAML click typer pypdf pdfminer.six rank-bm25

      - name: Execute frozen identity-only evaluator
        env:
          CAL_ROOT: ${{ github.workspace }}/_cal_successor
          CAL_FIXTURE_ROOT: ${{ github.workspace }}/_cal_fixture
          EB_ROOT: ${{ github.workspace }}/_eb
          CAL_EB_INTEGRATION_REPO: ${{ github.workspace }}/_eb
          C2_ROOT: ${{ github.workspace }}/_c2
          RESOLVER_JSON: ${{ github.workspace }}/_resolver_repo/research/contract_c2_current_cal_resolver_successor_rc0/RESOLVER.json
          PYTHONPATH: ${{ github.workspace }}/_cal_successor/src:${{ github.workspace }}/_eb/src
        run: |
          mkdir -p outputs
          python research/contract_c_cal_v1_polarity_identity_successor_rc0_20261003/evaluate.py outputs/result.json

      - name: Upload decisive receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-c-cal-polarity-identity-${{ github.sha }}
          if-no-files-found: warn
          path: |
            outputs/result.json
