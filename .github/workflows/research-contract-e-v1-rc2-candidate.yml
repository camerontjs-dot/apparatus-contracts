name: Research Contract E v1 RC2 candidate

on:
  push:
    branches:
      - research/contract-e-v1-rc2-dual-state-identity-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: RC2 candidate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify candidate identities
        shell: bash
        run: |
          set -euo pipefail
          base="docs/research/contract-e/v1-rc2-dual-state-identity-20260902/candidate"
          git hash-object "$base/SPEC.md"
          git hash-object "$base/schema.json"
          git hash-object "$base/reference.py"
          git hash-object "$base/test_candidate.py"
          sha256sum "$base/SPEC.md" "$base/schema.json" "$base/reference.py" "$base/test_candidate.py"
      - name: Run RC2 candidate suite
        shell: bash
        run: |
          set -euo pipefail
          cd docs/research/contract-e/v1-rc2-dual-state-identity-20260902/candidate
          python test_candidate.py

  migrated-pressure:
    name: RC2 migrated consumer against frozen D-to-E pressure matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC2 branch
        uses: actions/checkout@v4
        with:
          path: rc2
      - name: Checkout exact accepted pressure harness head
        uses: actions/checkout@v4
        with:
          ref: 79c0918af76c42e66c30831cd30a8d98d146c30c
          path: pressure-src
      - name: Checkout exact Contract D 1.0.0 release
        uses: actions/checkout@v4
        with:
          ref: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
          path: contract-d
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact Contract D canonicalization dependency
        run: python -m pip install --disable-pip-version-check 'rfc8785==0.1.4'
      - name: Verify frozen harness and Contract D identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pressure-src rev-parse HEAD)" = "79c0918af76c42e66c30831cd30a8d98d146c30c"
          test "$(git -C pressure-src hash-object docs/research/contract-e/d-to-e-authorization-consumer-pressure-20260902/attack_matrix.py)" = "10eb80cd1ca3b2279c17be934eff62b77c3f4513"
          test "$(git -C contract-d rev-parse HEAD)" = "298a1a0f7b7b6d7712e11200d04faec3e1ca169b"
          test "$(git -C contract-d hash-object validators/contract_d_core.py)" = "564dcde5677df5ac8f86f21dc0ffd1692f44c9f0"
          test "$(git -C contract-d hash-object validators/contract_d_consume.py)" = "8b4ad5c9d6fc1145cf334d1416b5d52b9ed93c68"
          test "$(git -C contract-d hash-object schema/contract-d/1.0.0/effect-registry.json)" = "a40f4f4447470654bdc16d852f5927189ae30cc5"
          test "$(git -C contract-d hash-object fixtures/contract-d/1.0.0/valid.json)" = "66f59bc50e5062aa8550491defa2fee37e75fcc7"
      - name: Apply exact preregistered RC2 consumer verifier migration
        shell: bash
        run: |
          set -euo pipefail
          cp pressure-src/docs/research/contract-e/d-to-e-authorization-consumer-pressure-20260902/attack_matrix.py "$RUNNER_TEMP/attack_matrix_rc2.py"
          python - <<'PY'
          from pathlib import Path
          path = Path("${{ runner.temp }}/attack_matrix_rc2.py")
          text = path.read_text(encoding="utf-8")
          old = '        for key in ("authority_state_id", "evaluation_time", "subject_id", "jurisdiction"):\n'
          new = (
              '        if receipt.get("authority_state_claimed_id") != req.get("authority_state_id"):\n'
              '            return False\n'
              '        if receipt.get("authority_state_computed_id") != req.get("authority_state_id"):\n'
              '            return False\n'
              '        for key in ("evaluation_time", "subject_id", "jurisdiction"):\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one RC1 verifier line, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Run frozen 101-case pressure matrix with migrated verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc2-e/docs/research/contract-e/v1-closure-20260902/candidate"
          cp rc2/docs/research/contract-e/v1-rc2-dual-state-identity-20260902/candidate/reference.py \
             "$RUNNER_TEMP/rc2-e/docs/research/contract-e/v1-closure-20260902/candidate/reference.py"
          python "$RUNNER_TEMP/attack_matrix_rc2.py" \
            --contract-d-root "$GITHUB_WORKSPACE/contract-d" \
            --contract-e-root "$RUNNER_TEMP/rc2-e" \
            --output "$RUNNER_TEMP/rc2-pressure-results.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("${{ runner.temp }}/rc2-pressure-results.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["case_count"] == 101, data
          assert data["pass_count"] == 101, data
          assert data["fail_count"] == 0, data
          assert data["failed_case_ids"] == [], data
          print("RC2_MIGRATED_CONSUMER_PRESSURE=101/101")
          PY
      - name: Upload migrated pressure result
        uses: actions/upload-artifact@v4
        with:
          name: contract-e-rc2-migrated-d-to-e-pressure
          path: ${{ runner.temp }}/rc2-pressure-results.json
          if-no-files-found: error
