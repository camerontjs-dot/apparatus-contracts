name: Research Contract E v1 RC2 candidate

on:
  push:
    branches:
      - research/contract-e-v1-rc2-dual-state-identity-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: RC2 candidate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify candidate identities
        shell: bash
        run: |
          set -euo pipefail
          base="docs/research/contract-e/v1-rc2-dual-state-identity-20260902/candidate"
          git hash-object "$base/SPEC.md"
          git hash-object "$base/schema.json"
          git hash-object "$base/reference.py"
          git hash-object "$base/test_candidate.py"
          sha256sum "$base/SPEC.md" "$base/schema.json" "$base/reference.py" "$base/test_candidate.py"
      - name: Run RC2 candidate suite
        shell: bash
        run: |
          set -euo pipefail
          cd docs/research/contract-e/v1-rc2-dual-state-identity-20260902/candidate
          python test_candidate.py

  pressure:
    name: RC2 against frozen D-to-E pressure matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC2 branch
        uses: actions/checkout@v4
        with:
          path: rc2
      - name: Checkout preregistered pressure harness
        uses: actions/checkout@v4
        with:
          ref: research/contract-d-to-e-authorization-consumer-pressure-20260902
          path: pressure-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pressure harness identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pressure-src hash-object docs/research/contract-e/d-to-e-authorization-consumer-pressure-20260902/attack_matrix.py)" = "10eb80cd1ca3b2279c17be934eff62b77c3f4513"
      - name: Run preregistered pressure matrix against RC2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc2-e/docs/research/contract-e/v1-closure-20260902/candidate"
          cp rc2/docs/research/contract-e/v1-rc2-dual-state-identity-20260902/candidate/reference.py \
             "$RUNNER_TEMP/rc2-e/docs/research/contract-e/v1-closure-20260902/candidate/reference.py"
          python pressure-src/docs/research/contract-e/d-to-e-authorization-consumer-pressure-20260902/attack_matrix.py \
            --contract-d-root "$GITHUB_WORKSPACE/rc2" \
            --contract-e-root "$RUNNER_TEMP/rc2-e" \
            --output "$RUNNER_TEMP/rc2-pressure-results.json"
          cat "$RUNNER_TEMP/rc2-pressure-results.json"
      - name: Upload pressure result
        uses: actions/upload-artifact@v4
        with:
          name: contract-e-rc2-d-to-e-pressure
          path: ${{ runner.temp }}/rc2-pressure-results.json
          if-no-files-found: error
