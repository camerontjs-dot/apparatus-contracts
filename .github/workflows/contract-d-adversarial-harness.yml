name: Contract D adversarial harness

on:
  push:
    branches:
      - research-infra/contract-d-adversarial-harness-v1
  workflow_dispatch:

jobs:
  attack-frozen-rc4:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Materialize exact frozen Contract D reference target
        shell: bash
        run: |
          set -euo pipefail
          target_commit='fd6923115116b0ced0f9feb5c005099d2e51ea88'
          prefix='research/contract-d-independent-authority-rc4/candidate'
          git fetch --no-tags --depth=1 origin "$target_commit"
          test "$(git rev-parse FETCH_HEAD)" = "$target_commit"
          mkdir -p /tmp/contract-d-target/fixtures
          for path in contract_d_core.py contract_d_validate.py contract_d_consume.py effect-registry.json; do
            git show "FETCH_HEAD:${prefix}/${path}" > "/tmp/contract-d-target/${path}"
          done
          git show "FETCH_HEAD:${prefix}/fixtures/valid.json" > /tmp/contract-d-target/fixtures/valid.json
          printf '%s\n' "$target_commit" > /tmp/contract-d-target/TARGET_COMMIT
      - name: Materialize exact frozen independent implementation
        shell: bash
        run: |
          set -euo pipefail
          independent_commit='79e94e7f3795472e31620cdbc4279dc399882ed5'
          independent_path='research/contract-d-rc4-fresh-reproduction-v2/contract_d_independent.py'
          mkdir -p /tmp/contract-d-independent /tmp/independent-git
          git -C /tmp/independent-git init
          git -C /tmp/independent-git fetch --no-tags --depth=1 \
            https://github.com/camerontjs-dot/research-scaffold-harness.git "$independent_commit"
          test "$(git -C /tmp/independent-git rev-parse FETCH_HEAD)" = "$independent_commit"
          git -C /tmp/independent-git show "FETCH_HEAD:${independent_path}" > /tmp/contract-d-independent/contract_d_independent.py
          test "$(git hash-object /tmp/contract-d-independent/contract_d_independent.py)" = 'bf4ea3eb9a5cf379d5923198225fed542cc6345e'
      - name: Run adversarial attacks in evidence mode
        shell: bash
        env:
          PYTHONPATH: research/contract-d-adversarial-harness-v1
        run: |
          set -euo pipefail
          python research/contract-d-adversarial-harness-v1/run_harness.py \
            --target /tmp/contract-d-target \
            --report-dir contract-d-adversarial-report
      - name: Discriminate finite-JSON depth boundary
        shell: bash
        env:
          PYTHONPATH: research/contract-d-adversarial-harness-v1
        run: |
          set -euo pipefail
          python research/contract-d-adversarial-harness-v1/probe_depth_boundary.py \
            --target /tmp/contract-d-target \
            --report-dir contract-d-adversarial-report
      - name: Compare frozen reference and frozen independent depth behavior
        shell: bash
        env:
          PYTHONPATH: research/contract-d-adversarial-harness-v1
        run: |
          set -euo pipefail
          ref="contract-d-adversarial-report/reference-depth-py${{ matrix.python }}.json"
          ind="contract-d-adversarial-report/independent-depth-py${{ matrix.python }}.json"
          python research/contract-d-adversarial-harness-v1/probe_depth_implementation.py \
            --kind reference --target /tmp/contract-d-target --out "$ref"
          python research/contract-d-adversarial-harness-v1/probe_depth_implementation.py \
            --kind independent --target /tmp/contract-d-independent \
            --fixture /tmp/contract-d-target/fixtures/valid.json --out "$ind"
          python research/contract-d-adversarial-harness-v1/summarize_depth_comparison.py \
            --reference "$ref" --independent "$ind" \
            --out "contract-d-adversarial-report/depth-comparison-py${{ matrix.python }}.md"
      - name: Probe Unicode scalar and cross-language numeric canonicalization
        shell: bash
        env:
          PYTHONPATH: research/contract-d-adversarial-harness-v1
        run: |
          set -euo pipefail
          python research/contract-d-adversarial-harness-v1/probe_unicode_numeric.py \
            --target /tmp/contract-d-target \
            --report-dir contract-d-adversarial-report
      - name: Self-test harness reporting
        shell: bash
        env:
          PYTHONPATH: research/contract-d-adversarial-harness-v1
        run: |
          set -euo pipefail
          python -m unittest -v research/contract-d-adversarial-harness-v1/test_harness_self.py
      - name: Show summary
        if: always()
        shell: bash
        run: |
          if test -f contract-d-adversarial-report/report.md; then cat contract-d-adversarial-report/report.md; fi
          if test -f contract-d-adversarial-report/depth-boundary.md; then cat contract-d-adversarial-report/depth-boundary.md; fi
          if test -f "contract-d-adversarial-report/depth-comparison-py${{ matrix.python }}.md"; then cat "contract-d-adversarial-report/depth-comparison-py${{ matrix.python }}.md"; fi
          if test -f contract-d-adversarial-report/unicode-numeric.md; then cat contract-d-adversarial-report/unicode-numeric.md; fi
      - name: Upload adversarial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-d-adversarial-report-py${{ matrix.python }}
          path: contract-d-adversarial-report/
          if-no-files-found: error

  attack-rc5-successor:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Materialize exact RC5 successor target
        shell: bash
        run: |
          set -euo pipefail
          target_commit='8f41d46e0fb78b49da981d5c8b1b8df61c80528e'
          prefix='research/contract-d-independent-authority-rc5/candidate'
          git fetch --no-tags --depth=1 origin "$target_commit"
          test "$(git rev-parse FETCH_HEAD)" = "$target_commit"
          mkdir -p /tmp/contract-d-rc5/fixtures
          for path in contract_d_core.py contract_d_validate.py contract_d_consume.py effect-registry.json requirements.txt; do
            git show "FETCH_HEAD:${prefix}/${path}" > "/tmp/contract-d-rc5/${path}"
          done
          git show "FETCH_HEAD:${prefix}/fixtures/valid.json" > /tmp/contract-d-rc5/fixtures/valid.json
          printf '%s\n' "$target_commit" > /tmp/contract-d-rc5/TARGET_COMMIT
      - name: Install exact RC5 canonicalizer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r /tmp/contract-d-rc5/requirements.txt
      - name: Run standards-expanded RC5 adversarial attacks in gate mode
        shell: bash
        env:
          PYTHONPATH: research/contract-d-adversarial-harness-v1
        run: |
          set -euo pipefail
          # Run 33354603157 is preserved as an evaluator defect: the first RC5
          # lane inherited RC4's stale assumption that depth 256 must remain valid.
          python research/contract-d-adversarial-harness-v1/run_rc5_harness_v3.py \
            --target /tmp/contract-d-rc5 \
            --report-dir contract-d-rc5-adversarial-report \
            --gate
      - name: Self-test harness reporting
        shell: bash
        env:
          PYTHONPATH: research/contract-d-adversarial-harness-v1
        run: |
          set -euo pipefail
          python -m unittest -v research/contract-d-adversarial-harness-v1/test_harness_self.py
      - name: Show RC5 summary
        if: always()
        shell: bash
        run: |
          if test -f contract-d-rc5-adversarial-report/report.md; then cat contract-d-rc5-adversarial-report/report.md; fi
      - name: Upload RC5 adversarial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-d-rc5-adversarial-report-py${{ matrix.python }}
          path: contract-d-rc5-adversarial-report/
          if-no-files-found: error
