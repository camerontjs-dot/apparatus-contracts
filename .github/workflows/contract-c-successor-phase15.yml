name: Contract C successor Phase 1.5 research

on:
  pull_request:
    paths:
      - "research/contract_c_successor_ground_up_20260913/**"
      - ".github/workflows/contract-c-successor-phase15.yml"

permissions:
  contents: read

jobs:
  phase15:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apparatus research head
        uses: actions/checkout@v4

      - name: Checkout exact qualified CAL RC1
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: a902621e8baea3063dddd7f92ba975aade305464
          path: _cal_rc1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact CAL RC1
        run: python -m pip install -e ./_cal_rc1

      - name: Execute Phase 1.5 discriminators
        run: |
          python research/contract_c_successor_ground_up_20260913/phase15_evaluate.py \
            --out research/contract_c_successor_ground_up_20260913/PHASE_1_5_RESULT.json

      - name: Upload frozen observation candidate
        uses: actions/upload-artifact@v4
        with:
          name: contract-c-successor-phase15-result
          path: research/contract_c_successor_ground_up_20260913/PHASE_1_5_RESULT.json
          if-no-files-found: error
