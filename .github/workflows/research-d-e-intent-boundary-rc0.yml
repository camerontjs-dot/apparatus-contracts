name: Research D-E intent boundary RC0

on:
  push:
    branches:
      - research/d-e-intent-boundary-rc0-20261003
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bakeoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen representation bake-off
        run: python research/d-e-intent-boundary-rc0-20261003/run_bakeoff.py
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d-e-intent-boundary-rc0
          path: |
            research/d-e-intent-boundary-rc0-20261003/PREREGISTRATION.md
            research/d-e-intent-boundary-rc0-20261003/CASES.json
            research/d-e-intent-boundary-rc0-20261003/FREEZE.json
            research/d-e-intent-boundary-rc0-20261003/RESULT.json
          if-no-files-found: error
