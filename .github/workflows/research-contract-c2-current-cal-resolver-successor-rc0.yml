name: Contract C2 current CAL resolver successor RC0

on:
  pull_request:
    paths:
      - ".github/workflows/research-contract-c2-current-cal-resolver-successor-rc0.yml"
      - "research/contract_c2_current_cal_resolver_successor_rc0/**"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research evaluator head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout exact Contract C2 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: b42c827acb0a9fe65353354d709add0e27bab307
          path: deps/c2
      - name: Checkout exact candidate resolver freeze
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 1d33e0612befcf8016816197c90c062373796df9
          path: deps/resolver-candidate
      - name: Checkout immutable predecessor resolver
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 43b571464734325277374ee81098553fb7c1b944
          path: deps/resolver-old
      - name: Checkout exact current CAL producer subject
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: c4974388e9a40a87661ed80af9271b9625b7c093
          path: deps/cal

      - name: Install exact current CAL
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e deps/cal

      - name: Verify frozen authority identities
        run: |
          set -euo pipefail
          test "$(git -C deps/c2 rev-parse HEAD)" = "b42c827acb0a9fe65353354d709add0e27bab307"
          test "$(git -C deps/resolver-candidate rev-parse HEAD)" = "1d33e0612befcf8016816197c90c062373796df9"
          test "$(git -C deps/resolver-old rev-parse HEAD)" = "43b571464734325277374ee81098553fb7c1b944"
          test "$(git -C deps/cal rev-parse HEAD)" = "c4974388e9a40a87661ed80af9271b9625b7c093"
          test "$(git -C deps/resolver-candidate hash-object research/contract_c2_current_cal_resolver_successor_rc0/RESOLVER.json)" = "1a408246fd3bef0758a958ae716b44ea74bc0689"
          test "$(git -C deps/cal hash-object research/contract_c2_current_cal_producer_conformance_rc1/materialize.py)" = "ef32fa4fca52a2bb7fe2896b378f9b6fdef0dfde"
          python - <<'PY'
          from claim_audit_lab.production_v1 import SEMANTIC_IMPLEMENTATION_SHA
          assert SEMANTIC_IMPLEMENTATION_SHA == "847cc970642bb648dc994b929c2053b5c9d4648c"
          PY

      - name: Execute independent resolver qualification
        run: |
          set -euo pipefail
          mkdir -p build/contract-c2-current-cal-resolver-successor-rc0
          python research/contract_c2_current_cal_resolver_successor_rc0/evaluate.py \
            --c2 deps/c2 \
            --resolver-candidate deps/resolver-candidate \
            --predecessor-resolver deps/resolver-old \
            --cal deps/cal \
            --out build/contract-c2-current-cal-resolver-successor-rc0/EVALUATION.json

      - name: Record exact execution receipt
        if: always()
        run: |
          mkdir -p build/contract-c2-current-cal-resolver-successor-rc0
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          out = Path("build/contract-c2-current-cal-resolver-successor-rc0")
          def git(cwd, *args):
              return subprocess.check_output(["git", "-C", cwd, *args], text=True).strip()
          record = {
              "schema": "contract-c2-current-cal-resolver-successor-rc0-execution-v1",
              "evaluator_head": git(".", "rev-parse", "HEAD"),
              "contract_c2_head": git("deps/c2", "rev-parse", "HEAD"),
              "candidate_resolver_freeze": git("deps/resolver-candidate", "rev-parse", "HEAD"),
              "candidate_resolver_blob": git("deps/resolver-candidate", "hash-object", "research/contract_c2_current_cal_resolver_successor_rc0/RESOLVER.json"),
              "predecessor_resolver": git("deps/resolver-old", "rev-parse", "HEAD"),
              "cal_producer_subject": git("deps/cal", "rev-parse", "HEAD"),
              "cal_materializer_blob": git("deps/cal", "hash-object", "research/contract_c2_current_cal_producer_conformance_rc1/materialize.py"),
          }
          p = out / "EVALUATION.json"
          if p.exists():
              record["evaluation_sha256"] = "sha256:" + hashlib.sha256(p.read_bytes()).hexdigest()
          (out / "EXECUTION.json").write_text(json.dumps(record, sort_keys=True, indent=2) + "\n")
          PY

      - name: Upload resolver qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-c2-current-cal-resolver-successor-rc0
          path: build/contract-c2-current-cal-resolver-successor-rc0
          if-no-files-found: error
