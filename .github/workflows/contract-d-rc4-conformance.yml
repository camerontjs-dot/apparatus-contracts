name: Contract D RC4 research conformance

on:
  push:
    branches:
      - research/contract-d-independent-authority-rc4
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q research/contract-d-independent-authority-rc4/candidate/tests/test_rc4.py
