name: Research Contract E RC2 fractional currentness discriminator

on:
  push:
    branches:
      - research/contract-e-rc2-fractional-currentness-discriminator-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discriminator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact canonicalization dependency
        run: python -m pip install --disable-pip-version-check 'rfc8785==0.1.4'
      - name: Verify frozen candidate reference byte identity
        shell: bash
        run: |
          set -euo pipefail
          path="docs/research/contract-e/v1-successor-rc2-20260902/candidate/reference.py"
          test "$(git hash-object "$path")" = "fda14bb18c66c51747b7b506abb8df8a55a8d166"
      - name: Execute exact fractional currentness discriminator
        id: run
        shell: bash
        run: |
          set +e
          python docs/research/contract-e/v1-successor-rc2-20260902/fractional_currentness_discriminator.py
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload discriminator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-e-rc2-fractional-currentness-discriminator
          path: RC2-FRACTIONAL-CURRENTNESS-DISCRIMINATOR.json
          if-no-files-found: error
      - name: Enforce scientific discriminator
        shell: bash
        run: |
          test "${{ steps.run.outputs.exit_code }}" = "0"
