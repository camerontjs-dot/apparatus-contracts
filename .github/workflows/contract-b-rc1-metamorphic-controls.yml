name: Contract B RC1 metamorphic controls

on:
  push:
    branches:
      - research/contract-b-rc1-metamorphic-controls
    paths:
      - 'docs/experiments/contract-b-rc1-metamorphic-preregistration-2026-08-27.md'
      - 'experiments/contract_b_rc1_metamorphic_controls.py'
      - 'experiments/contract_b_rc1_consumer_a.py'
      - 'experiments/contract_b_rc1_consumer_b.mjs'
      - '.github/workflows/contract-b-rc1-metamorphic-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apparatus control branch
        uses: actions/checkout@v4

      - name: Checkout pinned Evidence Bundler research head
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: b4ca9111f5957ef7e7955e2c5024f2280ee19eb5
          path: _deps/evidence-bundler

      - name: Checkout pinned Claim Audit Lab research head
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 6acc3462dad73959ccec6bccf8407215f5274cf6
          path: _deps/claim-audit-lab

      - name: Verify exact dependency heads
        shell: bash
        run: |
          test "$(git -C _deps/evidence-bundler rev-parse HEAD)" = "b4ca9111f5957ef7e7955e2c5024f2280ee19eb5"
          test "$(git -C _deps/claim-audit-lab rev-parse HEAD)" = "6acc3462dad73959ccec6bccf8407215f5274cf6"
          git rev-parse HEAD

      - name: Verify frozen RC1 consumers unchanged from parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD:experiments/contract_b_rc1_consumer_a.py)" = "2df5419ce8ca138f27ac381e246e864411bb8587"
          test "$(git rev-parse HEAD:experiments/contract_b_rc1_consumer_b.mjs)" = "230c86dd2d84d1d2618cbf4f92291d6da596e597"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frozen fixture dependency
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Execute preregistered controls
        shell: bash
        run: |
          python experiments/contract_b_rc1_metamorphic_controls.py \
            --eb-root _deps/evidence-bundler \
            --out experiment-results/contract-b-rc1-metamorphic

      - name: Upload control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-b-rc1-metamorphic-${{ github.run_id }}
          path: experiment-results/contract-b-rc1-metamorphic/
          if-no-files-found: warn
