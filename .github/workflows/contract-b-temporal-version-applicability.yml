name: Contract B temporal version applicability research

on:
  push:
    branches:
      - research/contract-b-temporal-version-applicability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-applicability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Apparatus experiment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Evidence Bundler research head
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: b4ca9111f5957ef7e7955e2c5024f2280ee19eb5
          path: _deps/evidence-bundler

      - name: Checkout pinned Claim Audit Lab research head
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 6acc3462dad73959ccec6bccf8407215f5274cf6
          path: _deps/claim-audit-lab

      - name: Verify exact heads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiment-results/contract-b-temporal-version
          APPARATUS_HEAD="$(git rev-parse HEAD)"
          EB_HEAD="$(git -C _deps/evidence-bundler rev-parse HEAD)"
          CAL_HEAD="$(git -C _deps/claim-audit-lab rev-parse HEAD)"
          printf 'apparatus_experiment=%s\nevidence_bundler=%s\nclaim_audit_lab=%s\n' \
            "$APPARATUS_HEAD" "$EB_HEAD" "$CAL_HEAD" \
            | tee experiment-results/contract-b-temporal-version/pins.txt
          test "$EB_HEAD" = "b4ca9111f5957ef7e7955e2c5024f2280ee19eb5"
          test "$CAL_HEAD" = "6acc3462dad73959ccec6bccf8407215f5274cf6"
          git merge-base --is-ancestor f4ee2dbd853821ba54328156bbab1c71235fae55 HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal research dependency
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML

      - name: Execute corrected temporal/version applicability runner
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/_deps/evidence-bundler/src
        run: |
          set -euo pipefail
          python experiments/contract_b_temporal_version_applicability_final.py \
            --evidence-bundler-root _deps/evidence-bundler \
            --cal-root _deps/claim-audit-lab \
            --output experiment-results/contract-b-temporal-version/result.json \
            2>&1 | tee experiment-results/contract-b-temporal-version/run.log

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-b-temporal-version-${{ github.run_id }}
          path: experiment-results/contract-b-temporal-version/
          if-no-files-found: error
          retention-days: 90
