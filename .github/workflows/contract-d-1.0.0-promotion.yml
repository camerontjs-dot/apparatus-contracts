name: Contract D 1.0.0 promotion gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'contract-d-v1.0.0.md'
      - 'schema/contract-d/**'
      - 'fixtures/contract-d/**'
      - 'validators/contract_d_*.py'
      - 'tests/test_contract_d_v1.py'
      - 'pyproject.toml'
      - '.github/workflows/contract-d-1.0.0-promotion.yml'
  push:
    branches:
      - promotion/contract-d-1.0.0

permissions:
  contents: read

jobs:
  contract-d-v1:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact production dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run Contract D v1 production conformance
        run: python -m pytest -q tests/test_contract_d_v1.py
      - name: Check public version surfaces agree
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from validators.contract_d_core import CONTRACT_D_VERSION
          assert CONTRACT_D_VERSION == '1.0.0'
          versions = json.loads(Path('schema/contract-d/versions.json').read_text())
          assert versions == {'canonical_version':'1.0.0','supported_versions':['1.0.0']}
          schema = json.loads(Path('schema/contract-d/1.0.0/schema.json').read_text())
          assert schema['properties']['contract_d_version']['const'] == '1.0.0'
          assert 'operational Authorization' in Path('contract-d-v1.0.0.md').read_text()
          PY
