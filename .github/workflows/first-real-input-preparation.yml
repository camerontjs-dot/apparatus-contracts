name: First real-input preparation portable checks

on:
  pull_request:
    paths:
      - "research/first_real_input_evidence_to_decision_20260927/**"
      - ".github/workflows/first-real-input-preparation.yml"
  push:
    branches:
      - "research-infra/first-real-input-evidence-to-decision-prep-20260927"
      - "research-infra/first-real-input-single-item-prep-20260927"
    paths:
      - "research/first_real_input_evidence_to_decision_20260927/**"
      - ".github/workflows/first-real-input-preparation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ERS_SINGLE_SHA: 3cf04f2defa07513ec2be4418d41698ca7aeebab
  ERS_LEGACY_BLOB: 976f7d506dcbd9363896894fd056e7b47a0f755c
  ERS_LEGACY_SHA256: aaca130854e7e088e83a320d36eec0ff45f41097205c967d076a11243f22f547

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact ERS single-item successor
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/epistemic-research-system
          ref: ${{ env.ERS_SINGLE_SHA }}
          path: _subjects/ers-single
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact ERS successor and frozen predecessor source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _subjects/ers-single rev-parse HEAD)" = "$ERS_SINGLE_SHA"
          test "$(git -C _subjects/ers-single rev-parse HEAD:harness/backlog_single_item_intake.py)" = "bfc0ea5c7ec9ed8ecb2cf7621ec9d8eca83e02e9"
          test "$(git -C _subjects/ers-single rev-parse HEAD:harness/test_backlog_single_item_intake.py)" = "75888c065fecd8b2dc5bbcb362063fc4d043a5a8"
          test "$(git -C _subjects/ers-single rev-parse HEAD:harness/backlog_intake.py)" = "$ERS_LEGACY_BLOB"
          test "$(sha256sum _subjects/ers-single/harness/backlog_intake.py | awk '{print $1}')" = "$ERS_LEGACY_SHA256"

      - name: Execute exact ERS portable controls
        working-directory: _subjects/ers-single
        run: |
          python -m py_compile harness/backlog_single_item_intake.py harness/test_backlog_single_item_intake.py
          python -m unittest harness.test_backlog_single_item_intake -v
          python -m unittest harness.test_backlog_intake -v

      - name: Compile preparation scripts
        run: |
          python -m py_compile research/first_real_input_evidence_to_decision_20260927/scripts/*.py

      - name: Run preparation fixture and failure-control tests
        run: |
          python -m unittest discover             -s research/first_real_input_evidence_to_decision_20260927/tests             -p 'test_*.py' -v

      - name: Validate static manifests and subject distinctions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("research/first_real_input_evidence_to_decision_20260927")
          subjects = json.loads((root / "SUBJECTS.json").read_text())
          assert subjects["schema"] == "cal-pipeline-first-real-input-subjects-v2"
          assert subjects["subjects"]["ers_intake"]["commit"] == "3cf04f2defa07513ec2be4418d41698ca7aeebab"
          assert subjects["subjects"]["ers_intake"]["predecessor_commit"] == "5c22d846174154f00649efc6b312f5409c6d1a3d"
          assert subjects["subjects"]["evidence_bundler"]["commit"] == "08ca896debd6d16fa21be2f178ed7cbe62395d00"
          assert subjects["historical_reference"]["evidence_bundler_commit"] == "4e1f6fe00e7c350b28f52bfea14f1f8988847884"
          assert subjects["subjects"]["evidence_bundler"]["commit"] != subjects["historical_reference"]["evidence_bundler_commit"]
          for name in (
              "ERS_ALLOWLIST.template.json",
              "SELECTION.template.json",
              "TARGET_REVIEW.template.json",
              "RUN_MANIFEST.template.json",
          ):
              json.loads((root / name).read_text())
          PY

      - name: Show local-only runner interfaces without executing private subjects
        run: |
          python research/first_real_input_evidence_to_decision_20260927/scripts/verify_subjects.py --help >/dev/null
          python research/first_real_input_evidence_to_decision_20260927/scripts/run_current_subject.py --help >/dev/null
